<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giga — Happy Pride</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2.25rem; background: #0b0b10;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .emblem { position: relative; width: min(58vmin, 480px); aspect-ratio: 1; }

  .gradient {
    position: absolute; inset: 0; overflow: hidden;
    -webkit-mask: var(--logo-mask) center / contain no-repeat;
            mask: var(--logo-mask) center / contain no-repeat;
  }

  .mesh {
    position: absolute; inset: -25%;
    background: radial-gradient(circle at 50% 45%, #ffeef7 0%, #e9e2ff 100%);
    filter: blur(45px) saturate(1.25);
    animation: hue 26s linear infinite;
  }
  @keyframes hue { to { filter: blur(45px) saturate(1.25) hue-rotate(360deg); } }

  .blob { position: absolute; width: 55%; aspect-ratio: 1; border-radius: 50%; }
  .b1 { top: -5%;   left: 2%;   background: radial-gradient(circle, #ff9aa2 0%, transparent 65%); animation: d1 13s ease-in-out infinite alternate; }
  .b2 { top: -4%;   right: -2%; background: radial-gradient(circle, #ffc89b 0%, transparent 65%); animation: d2 16s ease-in-out infinite alternate; }
  .b3 { top: 30%;   right: -8%; background: radial-gradient(circle, #fff3a8 0%, transparent 65%); animation: d3 12s ease-in-out infinite alternate; }
  .b4 { bottom: -6%; right: 8%; background: radial-gradient(circle, #a8e6c9 0%, transparent 65%); animation: d4 17s ease-in-out infinite alternate; }
  .b5 { bottom: -8%; left: 2%;  background: radial-gradient(circle, #9ec5ff 0%, transparent 65%); animation: d5 14s ease-in-out infinite alternate; }
  .b6 { top: 32%;   left: -8%;  background: radial-gradient(circle, #cdb4ff 0%, transparent 65%); animation: d6 15s ease-in-out infinite alternate; }
  .b7 { top: 22%;   left: 22%;  width: 64%; background: radial-gradient(circle, #ffc6f2 0%, transparent 65%); animation: d7 19s ease-in-out infinite alternate; }

  @keyframes d1 { to { transform: translate(34%, 26%)  scale(1.25); } }
  @keyframes d2 { to { transform: translate(-30%, 24%) scale(1.15); } }
  @keyframes d3 { to { transform: translate(-26%, -18%) scale(1.3); } }
  @keyframes d4 { to { transform: translate(-22%, -30%) scale(1.2); } }
  @keyframes d5 { to { transform: translate(30%, -22%) scale(1.25); } }
  @keyframes d6 { to { transform: translate(26%, -14%) scale(1.15); } }
  @keyframes d7 { to { transform: translate(-16%, 18%) scale(0.85); } }

  .mark { display: none; }

  .title { color: #fff; font-size: clamp(1.5rem, 4.5vmin, 2.5rem); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
  .caption { color: rgba(255,255,255,.85); font-size: 1.05rem; letter-spacing: .14em; text-transform: uppercase; }

  @media (prefers-reduced-motion: reduce) { .mesh, .blob { animation: none; } }
</style>
</head>
<body>

<div class="title">Happy Pride</div>

<div class="emblem">
  <div class="gradient">
    <div class="mesh">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="blob b4"></div>
      <div class="blob b5"></div>
      <div class="blob b6"></div>
      <div class="blob b7"></div>
    </div>
  </div>

    <path d="M12.3494 0.0015974C16.7559 0.127663 20.5671 2.62678 22.5479 6.269C22.3822 6.34097 22.2136 6.40779 22.0408 6.46396C18.4552 7.62903 14.0069 5.11822 12.407 0.193359C12.3863 0.129709 12.3689 0.0651468 12.3494 0.0015974Z" fill="white"/>
  </svg>
</div>

<div class="caption">Loud and proud</div>

<script>
  const svgMarkup = document.querySelector('.mark').outerHTML;
  document.documentElement.style.setProperty(
    '--logo-mask',
    `url("data:image/svg+xml,${encodeURIComponent(svgMarkup)}")`
  );
</script>

</body>
</html>
